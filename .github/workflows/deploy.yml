name: Check and Deploy

on:
  push:
    branches: ["main"]  # main 브랜치에 푸시될 때 실행 (master라면 master로 변경)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # [1단계] 코드 검사 (테스트)
  check-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (코드 가져오기)
        uses: actions/checkout@v4

      - name: Setup Node.js (도구 설치 준비)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTMLHint (HTML 검사기 설치)
        run: npm install -g htmlhint

      - name: Run HTML Check (HTML 문법 검사)
        run: htmlhint index.html
        # 만약 에러가 발견되면 여기서 멈추고 배포가 취소됩니다.

  # [2단계] 배포 (검사가 통과해야만 실행됨)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check-quality  # <--- 중요: 위의 'check-quality'가 성공해야만 실행됨
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
