# 워크플로우의 이름입니다. GitHub Actions 탭 목록에 이 이름으로 표시됩니다.
name: Test and Deploy

# 언제 이 작업이 실행될지 정하는 부분입니다.
on:
  push:
    branches: ["main"]  # 'main' 브랜치에 코드가 올라오면(push) 자동으로 실행합니다.
  workflow_dispatch:    # (선택 사항) GitHub 화면에서 수동으로 버튼을 눌러 실행할 수도 있게 합니다.

# GitHub Actions가 우리 저장소에 접근할 수 있는 권한을 설정합니다.
permissions:
  contents: read        # 코드를 읽을 수 있는 권한
  pages: write          # GitHub Pages에 배포할 수 있는 권한
  id-token: write       # 보안 인증 토큰을 쓸 수 있는 권한

# 동시에 여러 배포가 요청될 때의 처리 방식입니다.
concurrency:
  group: "pages"
  cancel-in-progress: false # 진행 중인 배포를 취소하지 않고 순서대로 처리합니다.

# 실제 할 일(Jobs)들을 정의합니다. 여기서는 1.테스트 -> 2.배포 순서로 진행됩니다.
jobs:
  # [1단계] 테스트 작업 (이름: test-suite)
  # 배포하기 전에 코드가 정상인지 검사하는 단계입니다.
  test-suite:
    runs-on: ubuntu-latest  # 최신 리눅스(Ubuntu) 환경에서 실행합니다.
    steps:
      # 1. GitHub 저장소에 있는 코드를 이 가상 컴퓨터로 내려받습니다.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 자바스크립트 실행 환경(Node.js)을 설치합니다. (버전 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm' (잠금 파일 에러 방지를 위해 캐시 기능은 잠시 껐습니다)

      # 3. 필요한 라이브러리들(Playwright, HTMLHint 등)을 설치합니다.
      # 'npm install'은 package.json을 보고 필요한 도구들을 자동으로 설치해줍니다.
      - name: Install Dependencies
        run: npm install

      # 4. 기능 테스트에 필요한 가상 브라우저(크롬, 파이어폭스 등)를 설치합니다.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. [검사 1] HTML 문법에 오타나 닫지 않은 태그가 없는지 검사합니다.
      - name: Run HTMLHint (문법 검사)
        run: |
          npm install -g htmlhint   # 문법 검사 도구 설치
          htmlhint index.html       # index.html 파일 검사 시작

      # 6. [검사 2] 실제 브라우저를 띄워 버튼 클릭, 그래프 표시 등이 잘 되는지 테스트합니다.
      - name: Run Functional Tests (기능 검사)
        run: |
          npx http-server -p 8080 &        # 8080 포트로 가상 서버를 엽니다 (&는 백그라운드 실행)
          npx wait-on http://127.0.0.1:8080 # 서버가 완전히 켜질 때까지 기다립니다.
          npx playwright test              # 테스트 코드를 실행합니다.

  # [2단계] 배포 작업 (이름: deploy)
  # 위의 테스트가 모두 통과했을 때만 실행됩니다.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # ★ 가장 중요한 부분: 'test-suite' 작업이 성공해야만 이 작업이 시작됩니다.
    needs: test-suite
    
    # 이전 단계가 실패하면 배포도 하지 않습니다.
    if: success()
    
    steps:
      # 배포를 위해 다시 코드를 확인합니다.
      - name: Checkout
        uses: actions/checkout@v4
      
      # GitHub Pages 배포를 위한 설정을 잡습니다.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      # 배포할 파일들을 묶어서 업로드 준비를 합니다.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 현재 폴더의 모든 내용을 업로드합니다.
      
      # 실제로 GitHub Pages에 배포하여 사이트를 업데이트합니다.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
