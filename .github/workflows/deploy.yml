name: Check and Deploy

on:
  push:
    branches: ["main"]  # main 브랜치에 푸시될 때 실행 (master라면 master로 변경)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # [1단계] 코드 검사 (테스트)
  check-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (코드 가져오기)
        uses: actions/checkout@v4

      - name: Setup Node.js (도구 설치 준비)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

  # 1. HTML 문법 검사
      - name: Run HTMLHint (문법 검사)
        run: |
          npm install -g htmlhint
          htmlhint index.html

  # 2. 서버 실행 및 기능 테스트 (Playwright)
      - name: Run Functional Tests (기능 검사)
        run: |
          # 백그라운드에서 로컬 서버 실행 (8080포트)
          npx http-server -p 8080 & 
          # 서버가 켜질 때까지 잠시 대기
          npx wait-on http://127.0.0.1:8080
          # 테스트 실행
          npx playwright test

  # [2단계] 배포 (위의 test-suite가 성공해야만 실행됨)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-suite  # <--- 중요: 테스트가 통과해야 배포됨
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
