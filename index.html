<script>
        // --- 유틸리티: 날짜 포맷 (YYYY-MM-DD) ---
        function getTodayStr() {
            return new Date().toISOString().split('T')[0];
        }

        // 초기화 시 날짜 세팅
        document.getElementById('entryDate').value = getTodayStr();
        document.getElementById('startDate').value = getTodayStr();
        document.getElementById('endDate').value = getTodayStr();

        // --- API 키 관리 ---
        function loadApiKey() {
            const key = localStorage.getItem('geminiApiKey');
            if (key) {
                document.getElementById('apiKey').value = key;
                document.getElementById('apiKeyCard').classList.add('hidden');
                document.getElementById('apiKeyStatus').classList.remove('hidden');
            }
        }
        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (!key) return alert("API 키를 입력해주세요.");
            localStorage.setItem('geminiApiKey', key);
            loadApiKey();
        }
        function resetApiKey() {
            localStorage.removeItem('geminiApiKey');
            document.getElementById('apiKey').value = '';
            document.getElementById('apiKeyCard').classList.remove('hidden');
            document.getElementById('apiKeyStatus').classList.add('hidden');
        }

        // --- 이미지 압축 및 Gemini 전송 (핵심 수정 부분) ---
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('ocrLoader').style.display = 'block';
            document.getElementById('ocrLoader').innerText = "🔄 이미지 압축 및 분석 중...";

            try {
                // 1. 이미지 압축 (Promise 기반)
                const compressedBase64 = await compressImage(file);
                
                // 2. Gemini 분석 요청
                await analyzeImage(compressedBase64);
            } catch (error) {
                console.error(error);
                alert("오류 발생: " + error.message);
                document.getElementById('ocrLoader').style.display = 'none';
            }
        }

        // 이미지 리사이징 함수 (최대 폭 1024px, JPEG 0.7 퀄리티)
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 1024; // 최대 너비 제한
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // JPEG 포맷, 품질 0.7로 변환 후 헤더 제거
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(dataUrl.split(',')[1]);
                    };
                    img.onerror = (err) => reject(new Error("이미지 파일 로드 실패"));
                };
                reader.onerror = (err) => reject(new Error("파일 읽기 실패"));
            });
        }

        async function analyzeImage(base64Image) {
            const apiKey = localStorage.getItem('geminiApiKey');
            if (!apiKey) throw new Error("API 키가 설정되지 않았습니다.");

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const prompt = `
                Analyze the nutrition facts image (Korean). 
                Extract: foodName(string), kcal, sodium, carbo, sugar, fat, protein.
                Return ONLY JSON. Values should be numbers (remove 'g', 'mg', 'kcal').
                If a value is not found, use 0.
            `;

            const requestBody = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                    ]
                }]
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "API 호출 실패");
            }

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            const result = JSON.parse(text.replace(/```json|```/g, '').trim());
            
            fillForm(result);
            document.getElementById('ocrLoader').style.display = 'none';
        }

        // 이벤트 리스너 연결
        document.getElementById('imageInput').addEventListener('change', handleImageUpload);

        function fillForm(data) {
            if(data.foodName && data.foodName !== 'Unknown') document.getElementById('foodName').value = data.foodName;
            ['kcal','sodium','carbo','sugar','fat','protein'].forEach(k => document.getElementById(k).value = data[k] || 0);
        }

        // --- 데이터 관리 ---
        function addFood() {
            const getVal = (id) => Number(document.getElementById(id).value) || 0;
            const dateStr = document.getElementById('entryDate').value || getTodayStr();

            const food = {
                id: Date.now(),
                dateStr: dateStr, 
                name: document.getElementById('foodName').value || '이름 없음',
                kcal: getVal('kcal'), sodium: getVal('sodium'), carbo: getVal('carbo'),
                sugar: getVal('sugar'), fat: getVal('fat'), protein: getVal('protein')
            };

            const foods = JSON.parse(localStorage.getItem('foodLog')) || [];
            foods.push(food);
            localStorage.setItem('foodLog', JSON.stringify(foods));
            
            renderList();
            calculateStats();
            
            document.getElementById('foodName').value = '';
            document.querySelectorAll('.grid-2 input').forEach(i => i.value = '');
        }

        // --- 통계 및 리스트 (이전과 동일) ---
        function calculateStats() {
            const foods = JSON.parse(localStorage.getItem('foodLog')) || [];
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            if (!startDate || !endDate) return;

            const dailyStats = {};
            foods.forEach(food => {
                const fDate = food.dateStr || new Date(food.id).toISOString().split('T')[0];
                if (fDate >= startDate && fDate <= endDate) {
                    if (!dailyStats[fDate]) dailyStats[fDate] = { kcal: 0, carbo: 0, protein: 0, fat: 0 };
                    dailyStats[fDate].kcal += food.kcal;
                    dailyStats[fDate].carbo += food.carbo;
                    dailyStats[fDate].protein += food.protein;
                    dailyStats[fDate].fat += food.fat;
                }
            });

            const tbody = document.getElementById('statsBody');
            tbody.innerHTML = '';
            const sortedDates = Object.keys(dailyStats).sort();

            if (sortedDates.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">기록 없음</td></tr>';
            } else {
                sortedDates.forEach(date => {
                    const stat = dailyStats[date];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${date.substring(5)}</td><td class="stat-highlight">${stat.kcal}</td><td>${stat.carbo}</td><td>${stat.protein}</td><td>${stat.fat}</td>`;
                    tbody.appendChild(tr);
                });
            }
            document.getElementById('statsResult').classList.remove('hidden');
        }

        function renderList() {
            const foods = JSON.parse(localStorage.getItem('foodLog')) || [];
            const list = document.getElementById('foodList');
            list.innerHTML = '';
            foods.slice().reverse().slice(0, 10).forEach(f => {
                const displayDate = f.dateStr || '날짜 없음';
                const div = document.createElement('div');
                div.className = 'food-item';
                div.innerHTML = `
                    <div class="food-header"><span class="food-name">${f.name}</span><span style="font-size:0.8rem; color:#888;">${displayDate}</span></div>
                    <div class="food-detail"><span class="food-kcal">${f.kcal} kcal</span> | 탄 ${f.carbo} · 단 ${f.protein} · 지 ${f.fat} <button class="delete-btn" onclick="deleteFood(${f.id})">삭제</button></div>
                `;
                list.appendChild(div);
            });
        }

        function deleteFood(id) {
            let foods = JSON.parse(localStorage.getItem('foodLog')) || [];
            foods = foods.filter(f => f.id !== id);
            localStorage.setItem('foodLog', JSON.stringify(foods));
            renderList();
            calculateStats();
        }

        function clearAll() {
            if(confirm('모든 기록 삭제?')) {
                localStorage.removeItem('foodLog');
                renderList();
                calculateStats();
            }
        }

        loadApiKey();
        renderList();
        calculateStats();
    </script>
