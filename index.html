<script>
        // --- 1. 기본 설정 및 날짜 ---
        function getTodayStr() { return new Date().toISOString().split('T')[0]; }
        document.getElementById('entryDate').value = getTodayStr();
        document.getElementById('startDate').value = getTodayStr();
        document.getElementById('endDate').value = getTodayStr();

        // --- 2. API 키 관리 ---
        function loadApiKey() {
            const key = localStorage.getItem('geminiApiKey');
            if (key) {
                document.getElementById('apiKey').value = key;
                document.getElementById('apiKeyCard').classList.add('hidden');
                document.getElementById('apiKeyStatus').classList.remove('hidden');
            }
        }
        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (!key) return alert("API 키를 입력해주세요.");
            localStorage.setItem('geminiApiKey', key);
            loadApiKey();
        }
        function resetApiKey() {
            localStorage.removeItem('geminiApiKey');
            document.getElementById('apiKey').value = '';
            document.getElementById('apiKeyCard').classList.remove('hidden');
            document.getElementById('apiKeyStatus').classList.add('hidden');
        }

        // --- 3. 이미지 압축 및 분석 (429 에러 해결용 수정) ---
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 로딩 표시 및 입력 막기
            const loader = document.getElementById('ocrLoader');
            loader.style.display = 'block';
            loader.innerText = "🔄 용량 줄이는 중...";

            try {
                // 압축 실행
                const compressedBase64 = await compressImage(file);
                
                loader.innerText = "🤖 Gemini 분석 중...";
                await analyzeImage(compressedBase64);
            } catch (error) {
                alert("실패: " + error.message);
            } finally {
                // 로딩 끝
                loader.style.display = 'none';
                // 같은 파일 다시 선택 가능하게 초기화
                event.target.value = ''; 
            }
        }

        // 더 강력한 이미지 압축 함수
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        // 429 에러 방지를 위해 해상도를 700px로 낮춤
                        const maxWidth = 700; 
                        let width = img.width; 
                        let height = img.height;

                        if (width > maxWidth) { 
                            height *= maxWidth / width; 
                            width = maxWidth; 
                        }

                        canvas.width = width; 
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 화질을 0.5(50%)로 낮춰서 토큰 소모 최소화
                        resolve(canvas.toDataURL('image/jpeg', 0.5).split(',')[1]);
                    };
                    img.onerror = () => reject(new Error("이미지 로드 실패"));
                };
                reader.onerror = () => reject(new Error("파일 읽기 실패"));
            });
        }

        async function analyzeImage(base64Image) {
            const apiKey = localStorage.getItem('geminiApiKey');
            if (!apiKey) throw new Error("API 키가 없습니다.");
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const prompt = `Extract nutrition facts (Korean). Return JSON ONLY: foodName, kcal, sodium, carbo, sugar, fat, protein (numbers).`;
            
            const requestBody = { 
                contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }] 
            };

            const response = await fetch(url, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(requestBody) 
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                // 에러 메시지 상세 확인
                let msg = "서버 오류";
                if (response.status === 429) msg = "요청 한도 초과 (429). 1분 뒤에 다시 시도하세요.";
                else if (errorData.error && errorData.error.message) msg = errorData.error.message;
                
                throw new Error(msg);
            }
            
            const data = await response.json();
            
            if(!data.candidates || data.candidates.length === 0) {
                 throw new Error("AI가 아무것도 읽지 못했습니다. 사진을 다시 찍어주세요.");
            }

            const text = data.candidates[0].content.parts[0].text;
            fillForm(JSON.parse(text.replace(/```json|```/g, '').trim()));
        }

        document.getElementById('imageInput').addEventListener('change', handleImageUpload);

        function fillForm(data) {
            if(data.foodName && data.foodName !== 'Unknown') document.getElementById('foodName').value = data.foodName;
            ['kcal','sodium','carbo','sugar','fat','protein'].forEach(k => document.getElementById(k).value = data[k] || 0);
        }

        // --- 4. 데이터 저장 및 통계 ---
        function addFood() {
            const getVal = (id) => Number(document.getElementById(id).value) || 0;
            const dateStr = document.getElementById('entryDate').value || getTodayStr();

            const food = {
                id: Date.now(), dateStr: dateStr,
                name: document.getElementById('foodName').value || '이름 없음',
                kcal: getVal('kcal'), sodium: getVal('sodium'), carbo: getVal('carbo'),
                sugar: getVal('sugar'), fat: getVal('fat'), protein: getVal('protein')
            };

            const foods = JSON.parse(localStorage.getItem('foodLog')) || [];
            foods.push(food);
            localStorage.setItem('foodLog', JSON.stringify(foods));
            
            renderList(); calculateStats();
            document.getElementById('foodName').value = '';
            document.querySelectorAll('.grid-2 input').forEach(i => i.value = '');
        }

        function calculateStats() {
            const foods = JSON.parse(localStorage.getItem('foodLog')) || [];
            const sDate = document.getElementById('startDate').value;
            const eDate = document.getElementById('endDate').value;
            if(!sDate || !eDate) return;

            const dailyStats = {};
            foods.forEach(f => {
                const fDate = f.dateStr || new Date(f.id).toISOString().split('T')[0];
                if(fDate >= sDate && fDate <= eDate) {
                    if(!dailyStats[fDate]) dailyStats[fDate] = { k:0, c:0, p:0, f:0 };
                    dailyStats[fDate].k += f.kcal; dailyStats[fDate].c += f.carbo;
                    dailyStats[fDate].p += f.protein; dailyStats[fDate].f += f.fat;
                }
            });

            const tbody = document.getElementById('statsBody');
            tbody.innerHTML = '';
            const dates = Object.keys(dailyStats).sort();
            if(dates.length === 0) tbody.innerHTML = '<tr><td colspan="5">기록 없음</td></tr>';
            else dates.forEach(d => {
                const s = dailyStats[d];
                tbody.innerHTML += `<tr><td>${d.substring(5)}</td><td class="stat-highlight">${s.k}</td><td>${s.c}</td><td>${s.p}</td><td>${s.f}</td></tr>`;
            });
            document.getElementById('statsResult').classList.remove('hidden');
        }

        function renderList() {
            const foods = JSON.parse(localStorage.getItem('foodLog')) || [];
            const list = document.getElementById('foodList');
            list.innerHTML = '';
            foods.slice().reverse().slice(0, 10).forEach(f => {
                list.innerHTML += `
                    <div class="food-item">
                        <div class="food-header"><span class="food-name">${f.name}</span><span style="font-size:0.8rem; color:#888;">${f.dateStr||''}</span></div>
                        <div class="food-detail"><span class="food-kcal">${f.kcal} kcal</span> | 탄 ${f.carbo} · 단 ${f.protein} · 지 ${f.fat} 
                        <button class="delete-btn" onclick="deleteFood(${f.id})">삭제</button></div>
                    </div>`;
            });
        }

        function deleteFood(id) {
            const foods = JSON.parse(localStorage.getItem('foodLog')) || [];
            localStorage.setItem('foodLog', JSON.stringify(foods.filter(f => f.id !== id)));
            renderList(); calculateStats();
        }

        function clearAll() {
            if(confirm('모든 기록 삭제?')) { localStorage.removeItem('foodLog'); renderList(); calculateStats(); }
        }

        loadApiKey(); renderList(); calculateStats();
    </script>
